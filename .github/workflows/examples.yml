name: Cookbook examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-cookbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scene-contract:
    name: First scene contract (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static contract tests
        working-directory: examples/01-first-scene
        run: python -m unittest discover -s tests -v
